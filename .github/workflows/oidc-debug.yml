# Temporary: prints the claims (not the token) of this repository's OIDC token, to write the AWS
# trust policy. Removed right after.
name: oidc-debug
on:
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print the claims
        run: |
          token=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, repository, job_workflow_ref, event_name, ref}'
