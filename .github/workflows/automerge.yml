# Turns on auto-merge for a pull request that changes one plugin folder (its sub-folders too) and
# nothing else. GitHub then merges it once the required checks pass and the review approves (the
# ruleset on main).
# This job never checks out or runs the pull request's code.
name: automerge
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for a one-plugin change
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # A moved file counts at its old path too (previous_filename).
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          echo "Changed: $files"
          dirs=$(printf '%s\n' "$files" | awk -F/ '$1=="plugins" && NF>=3 {print $2; next} {print "<outside>"}' | sort -u)
          # A pull request that adds a library to libraries.json merges the same way: its review
          # fetches each new file from its official address and compares the SHA-256.
          if [ "$files" = "libraries.json" ]; then
            gh pr merge "$PR" --repo "$REPO" --auto --squash
            exit 0
          fi
          if [ "$(printf '%s\n' "$dirs" | wc -l)" -ne 1 ] || [ "$dirs" = "<outside>" ]; then
            echo "Not a change to one plugin folder: no auto-merge."
            exit 0
          fi
          gh pr merge "$PR" --repo "$REPO" --auto --squash
