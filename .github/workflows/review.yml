# The automatic review of AGENTS.md: Claude (in Amazon Bedrock) reads a one-plugin pull request and
# approves it or requests changes. It runs this repository's own tools from main and reads the pull
# request's files as text through the GitHub API; it never checks out or runs them. Only this
# workflow file on main can assume the AWS role (its trust policy names it).
name: review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  # The review waits for the static check of the same commit (tools/review.py).
  checks: read
  id-token: write
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # At most 20 minutes waiting for the static check, then the review itself.
    timeout-minutes: 40
    steps:
      # Actions by commit, packages by version: what runs next to the AWS role changes only
      # through a change to this repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the Anthropic SDK (before the AWS credentials exist)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check -r tools/review-requirements.txt
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::904233105607:role/pecofence-plugins-review
          aws-region: us-east-1
      - name: Review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: '"$RUNNER_TEMP/venv/bin/python" -I tools/review.py'
