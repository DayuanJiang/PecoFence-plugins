# Publishes the feed PecoFence reads on the branch "index": index-3.json (PecoFence 0.5.1 and later),
# index.json (0.5.0 and earlier), their Ed25519 signatures (private key in the secret
# INDEX_SIGNING_KEY) and <commit>/plugins/<id>/<files>,
# the layout the project website copies for PecoFence's third address. A merge made by the
# automation starts no other workflow, so this also runs every hour.
name: index
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: index

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Actions by commit, packages by version: what runs next to the signing key changes only
      # through a change to this repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The index's serial is the count of commits on main: it needs the whole history.
          fetch-depth: 0
      - name: Build and sign index-3.json and index.json
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check -r tools/index-requirements.txt
          "$RUNNER_TEMP/venv/bin/python" tools/build-index.py --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/feed" --require-signature
      - name: Publish when it changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The raw file: the contents API's JSON leaves "content" empty for a file over 1 MB.
          # The signature too: a new key signs the same index.json differently (Ed25519 signs the
          # same bytes the same way, so an unchanged key and index publish nothing).
          same=true
          for f in index.json index.json.sig index-3.json index-3.json.sig; do
            current=$(gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/$f?ref=index" 2>/dev/null || true)
            [ "$current" = "$(cat "$RUNNER_TEMP/feed/$f")" ] || same=false
          done
          if [ "$same" = true ]; then echo "the indexes are unchanged"; exit 0; fi
          cd "$RUNNER_TEMP/feed"
          git init -q -b index
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "index.json for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" index
          echo "published"
