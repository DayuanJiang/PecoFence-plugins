# Publishes index.json, the list PecoFence reads, on the branch "index". A merge made by the
# automation starts no other workflow, so this also runs every hour.
name: index
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: index

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build index.json
        shell: pwsh
        run: ./tools/build-index.ps1 -Commit $env:GITHUB_SHA -Out "$env:RUNNER_TEMP/index.json"
      - name: Publish when it changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          current=$(gh api "repos/$REPO/contents/index.json?ref=index" --jq .content 2>/dev/null | base64 -d 2>/dev/null || true)
          if [ "$current" = "$(cat "$RUNNER_TEMP/index.json")" ]; then echo "index.json unchanged"; exit 0; fi
          cd "$RUNNER_TEMP"
          mkdir publish && cp index.json publish/ && cd publish
          git init -q -b index
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -q -m "index.json for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" index
          echo "published"
