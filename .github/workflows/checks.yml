# The scripted checks of AGENTS.md, on every pull request, on GitHub's Linux machine with a
# read-only token and no secrets. "static" reads the files (tools/check.py); "dynamic" runs the
# plugin: main.js in PecoFence's own plugin host with fake host functions (pecofence-plugin-check,
# built from PecoFence at the commit below), and a web plugin's page in headless Chromium with
# the network cut off (tools/web-check.py).
name: checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  # The PecoFence commit whose crates/plugin-check the run check uses. It must be a commit pushed
  # to DayuanJiang/PecoFence that has the plugin host PecoFence ships (the owner sets it after
  # pushing PecoFence; README.md lists it). Raise it when PecoFence's plugin host changes.
  PECOFENCE_COMMIT: 88a52ae2dbbf7f55cb0a82070743ee643bbead0f
  PLAYWRIGHT_VERSION: 1.65.2

jobs:
  static:
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.which.outputs.plugin }}
      layer: ${{ steps.which.outputs.layer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which plugin
        id: which
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # --no-renames: a moved file counts at its old path too (a move out of another plugin's
          # folder or of the repository's own files is a change there).
          files=$(git diff --name-only --no-renames "$BASE" HEAD)
          echo "Changed: $files"
          ids=$(printf '%s\n' "$files" | awk -F/ '$1=="plugins" && NF>=3 {print $2; next} {print "<outside>"}' | sort -u)
          if [ "$(printf '%s\n' "$ids" | wc -l)" -ne 1 ] || [ "$ids" = "<outside>" ]; then
            echo "::error::A pull request changes the files of one plugin folder and nothing else (AGENTS.md section 1)."
            exit 1
          fi
          echo "plugin=$ids" >> "$GITHUB_OUTPUT"
          echo "layer=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8-sig")).get("layer", "light"))' "plugins/$ids/plugin.json" 2>/dev/null || echo light)" >> "$GITHUB_OUTPUT"
      - name: Static check (tools/check.py)
        env:
          PLUGIN: ${{ steps.which.outputs.plugin }}
          BASE: ${{ github.event.pull_request.base.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set +e
          out=$(python3 tools/check.py "plugins/$PLUGIN" --base "$BASE" --pr-author "$AUTHOR")
          code=$?
          echo "$out"
          printf '### Static check\n```\n%s\n```\n' "$out" >> "$GITHUB_STEP_SUMMARY"
          exit $code

  dynamic:
    needs: static
    runs-on: ubuntu-latest
    env:
      PLUGIN: ${{ needs.static.outputs.plugin }}
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DayuanJiang/PecoFence
          ref: ${{ env.PECOFENCE_COMMIT }}
          path: pecofence
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            pecofence/target
          key: plugin-check-${{ env.PECOFENCE_COMMIT }}
      - name: Build pecofence-plugin-check
        env:
          # A quick build: the release profile's whole-program optimisation is for the app.
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo build --release --locked -p pecofence-plugin-check --manifest-path pecofence/Cargo.toml
      - name: Run main.js (pecofence-plugin-check)
        run: |
          set +e
          out=$(pecofence/target/release/pecofence-plugin-check "plugins/$PLUGIN" --seconds 60 --json run.json)
          code=$?
          echo "$out"
          printf '### Run check\n```\n%s\n```\n' "$out" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Install headless Chromium
        if: needs.static.outputs.layer == 'web'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check "playwright==$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/venv/bin/playwright" install --with-deps chromium-headless-shell
      - name: Run index.html (tools/web-check.py)
        if: needs.static.outputs.layer == 'web'
        run: |
          set +e
          out=$("$RUNNER_TEMP/venv/bin/python" tools/web-check.py "plugins/$PLUGIN" --seconds 20 --json web.json)
          code=$?
          echo "$out"
          printf '### Web check\n```\n%s\n```\n' "$out" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-result
          path: |
            run.json
            web.json
          if-no-files-found: ignore
