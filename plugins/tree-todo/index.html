<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tree To-do</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
  <div id="app" class="app">
    <section id="week-bar" class="week-bar" aria-label="Week calendar">
      <button id="btn-prev-week" class="week-nav" type="button"></button>
      <div id="week-days" class="week-days"></div>
      <button id="btn-next-week" class="week-nav" type="button"></button>
    </section>

    <div id="notice-bar" class="notice-bar hidden" role="status"></div>

    <div id="filter-bar" class="popover-bar hidden">
      <div class="filter-pills" id="filter-pills">
        <button class="filter-pill active" type="button" data-filter="all"></button>
        <button class="filter-pill" type="button" data-filter="open"></button>
        <button class="filter-pill" type="button" data-filter="done"></button>
      </div>
      <input id="search-input" class="search-input" type="text" maxlength="100" autocomplete="off">
    </div>

    <div id="toolbox-bar" class="popover-bar hidden">
      <button id="btn-expand-all" class="pill-btn" type="button"></button>
      <button id="btn-collapse-all" class="pill-btn" type="button"></button>
      <button id="btn-carry-over" class="pill-btn" type="button"></button>
      <button id="btn-clear-done" class="pill-btn danger-btn" type="button"></button>
    </div>

    <main class="board-card">
      <div id="tree-list" class="tree-list" role="tree"></div>
      <button id="btn-big-add" class="big-add-btn" type="button"></button>
    </main>

    <footer class="footer">
      <div class="footer-left">
        <button id="btn-filter-toggle" class="footer-icon-btn" type="button"></button>
        <button id="btn-toolbox-toggle" class="footer-icon-btn" type="button"></button>
        <button id="btn-pull-today" class="footer-icon-btn" type="button"></button>
      </div>
      <div class="footer-right">
        <button id="btn-today-stat" class="stat-btn" type="button"></button>
        <span id="total-stat" class="stat-label"></span>
      </div>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
